<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>扫码进群 · 博士栈</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://csphd.org/join.html">
<style>
  *{box-sizing:border-box}
  body{margin:0;color:#16181d;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}
  main{max-width:800px;margin:auto;padding:28px 18px 60px}
  a{color:#1f6feb}
  h1{font-size:26px;margin:24px 0 8px}
  .note,footer{color:#5b6270;font-size:14px}
  .groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:24px 0}
  article{border:1px solid #e6e8ec;border-radius:14px;padding:18px;min-width:0}
  h2{font-size:18px;margin:0 0 12px}
  img{display:block;width:100%;height:auto}
  .download{display:inline-block;margin-top:12px}
  .expired{background:#fff8ee;border:1px solid #ead3ad;border-radius:8px;padding:14px}
  .expired p{margin:6px 0}
  .wechat{font-size:20px;font-weight:700;user-select:all}
  footer{border-top:1px solid #e6e8ec;padding-top:18px}
  @media(max-width:559px){.groups{grid-template-columns:1fr}}
</style>
<script src="./js/group-qr.js" defer></script>
<script src="./js/join.js" defer></script>
</head>
<body>
<main>
  <a href="./index.html">← 博士栈首页</a>
  <h1>扫码进群</h1>
  <p>填写表单后，选择感兴趣的群，用微信扫描二维码加入。</p>
  <p class="note">手机访问可保存二维码，再用微信「扫一扫」从相册识别。点击图片可查看原图。</p>
  <p id="status" role="status">正在加载入群二维码…</p>
  <noscript><p>请启用 JavaScript 以查看二维码及其有效状态。</p></noscript>
  <div id="groups" class="groups"></div>
  <footer>如有其他问题，请联系 <a href="mailto:contact@csphd.org">contact@csphd.org</a> · <a href="./privacy.html">隐私与使用说明</a></footer>
</main>
</body>
</html>
