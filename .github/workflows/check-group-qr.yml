name: check-group-qr

on:
  schedule:
    - cron: '23 16 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/groups.json'
      - 'assets/groups/**'
      - 'js/group-qr.js'
      - 'tools/check_group_qr.js'
      - 'tests/group-qr.test.js'
      - '.github/workflows/check-group-qr.yml'
  pull_request:
    paths:
      - 'data/groups.json'
      - 'assets/groups/**'
      - 'js/group-qr.js'
      - 'tools/check_group_qr.js'
      - 'tests/group-qr.test.js'
      - '.github/workflows/check-group-qr.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test tests/group-qr.test.js
      - run: node tools/check_group_qr.js
